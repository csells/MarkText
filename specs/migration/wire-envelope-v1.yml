{
  "schema": "marktext-wire-envelope-v1",
  "integerEncoding": "unsigned little-endian",
  "stringEncoding": "u32 byte-length-prefixed UTF-8",
  "identityAlphabet": "^[A-Za-z0-9._:-]+$",
  "maxChunkBytes": 262144,
  "memberOrder": [
    "livePlanDelta",
    "reviewDelta",
    "sessionDelta",
    "terminalOutcomeDelta"
  ],
  "memberBits": {
    "livePlanDelta": 1,
    "reviewDelta": 2,
    "sessionDelta": 4,
    "terminalOutcomeDelta": 8
  },
  "domains": {
    "chunk": "MarkText.WireChunk.v1\\0",
    "member": "MarkText.WireMember.v1\\0",
    "envelope": "MarkText.WireEnvelope.v1\\0"
  },
  "hash": "SHA-256",
  "hashFraming": {
    "domainTermination": "The terminal characters \\\\0 in each domain denote one NUL byte.",
    "hashReferenceEncoding": "32 raw digest bytes",
    "chunk": [
      "domain.chunk",
      "string(memberName)",
      "u32(chunkIndex)",
      "u32(chunkCount)",
      "u32(chunkByteLength)",
      "chunkBytes"
    ],
    "member": [
      "domain.member",
      "string(memberName)",
      "u32(memberByteLength)",
      "u32(chunkCount)",
      "chunkHash[0..chunkCount)"
    ],
    "envelope": [
      "domain.envelope",
      "string(schema)",
      "string(publicationId)",
      "string(baseSnapshotId)",
      "string(nextSnapshotId)",
      "string(transitionId or empty when absent)",
      "u32(memberMask)",
      "u32(memberCount)",
      "for each declared member in memberOrder: string(memberName), memberHash"
    ],
    "emptyMember": "One chunk with index 0, count 1, and zero payload bytes."
  },
  "publicationRules": {
    "stateChange": "transitionId is present and baseSnapshotId differs from nextSnapshotId",
    "outcomeOnly": "transitionId is absent, baseSnapshotId equals nextSnapshotId, and terminalOutcomeDelta is the sole nonempty member",
    "publish": "validate every declared member and the root hash before one immutable snapshot swap",
    "recovery": "a gap, base mismatch, missing member, or checksum failure leaves the prior snapshot mounted and requests a full snapshot"
  },
