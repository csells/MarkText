packages:
  - 'packages/*'
  # muya v2 (TS) nests its dev surface and Playwright suite inside its own
  # package directory rather than as siblings under packages/, so list them
  # explicitly.
  - 'packages/muya/examples'
  - 'packages/muya/e2e'

allowBuilds:
  ced: true
  electron-winstaller: true
  esbuild: true
  keytar: true
  # native-keymap's node-gyp build fails on Node v24+; deny pnpm's install-time
  # build and let scripts/postinstall.ts patch (C++20) + electron-rebuild it
  # for Electron's ABI instead. It must stay a regular dependency so
  # electron-builder packages it (a missing module aborts the packaged app at
  # boot with an invisible modal error dialog).
  native-keymap: false
  sharp: true
  unrs-resolver: true
  workerd: true
