name: Setup pnpm and Node.js
description: Install pnpm, Node.js, and project dependencies (skips postinstall scripts)

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: '22.21.1'

runs:
  using: composite
  steps:
    - name: Install Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Enable content-addressed pnpm
      shell: bash
      run: |
        package_manager='pnpm@10.33.4+sha512.1c67b3b359b2d408119ba1ed289f34b8fc3c6873412bec6fd264fbdc82489e510fcbecb9ce9d22dae7f3b76269d8441046014bdca53b9979cd7a561ad631b800'
        corepack_cli="$(node --input-type=module -e '
          import { dirname, resolve } from "node:path";
          process.stdout.write(resolve(
            dirname(process.execPath),
            process.platform === "win32"
              ? "node_modules/corepack/dist/corepack.js"
              : "../lib/node_modules/corepack/dist/corepack.js"
          ));
        ')"
        export MARKTEXT_COREPACK_CLI_PATH="$corepack_cli"
        export MARKTEXT_COREPACK_VERSION='0.34.0'
        export MARKTEXT_COREPACK_LAUNCHER_SHA256='3655bc798f300951f2070fee411b337d626b0c3ae80c2d24c46ccac4595d4bf9'
        export MARKTEXT_COREPACK_BUNDLE_SHA256='bafd892df44cd70740e23e5d43eeea934b4f261a9eaff3637dac29bdea74d829'
        # Capture instead of substituting inline: a failing Corepack child's
        # diagnostic must reach the log, not vanish into $(...).
        resolved="$(node scripts/runPinnedCorepack.mjs "$package_manager" --version)" || {
          resolution_code=$?
          echo "Pinned package-manager resolution failed (${resolution_code}): ${resolved}" >&2
          exit "$resolution_code"
        }
        test "$resolved" = "10.33.4"
        {
          echo "MARKTEXT_COREPACK_CLI_PATH=$MARKTEXT_COREPACK_CLI_PATH"
          echo "MARKTEXT_COREPACK_VERSION=$MARKTEXT_COREPACK_VERSION"
          echo "MARKTEXT_COREPACK_LAUNCHER_SHA256=$MARKTEXT_COREPACK_LAUNCHER_SHA256"
          echo "MARKTEXT_COREPACK_BUNDLE_SHA256=$MARKTEXT_COREPACK_BUNDLE_SHA256"
          # Hosted runners cap V8 at its ~2 GB default; the evidence and
          # document suites need more, and 4 GB fits the 7 GB VMs with
          # headroom for the runner itself.
          echo "NODE_OPTIONS=--max-old-space-size=4096"
        } >> "$GITHUB_ENV"

    - name: Publish the pinned package manager on PATH
      shell: bash
      run: |
        # Every later step invokes `pnpm` by name. Without a pinned shim ahead
        # of it on PATH, those steps resolve whatever binary the runner image
        # ships, defeating the authentication performed above.
        package_manager='pnpm@10.33.4+sha512.1c67b3b359b2d408119ba1ed289f34b8fc3c6873412bec6fd264fbdc82489e510fcbecb9ce9d22dae7f3b76269d8441046014bdca53b9979cd7a561ad631b800'
        bin_dir="$RUNNER_TEMP/marktext-pinned-pnpm"
        mkdir -p "$bin_dir"
        {
          echo '#!/usr/bin/env bash'
          echo 'set -euo pipefail'
          # The forwarding "$@" must land in the shim literally; expanding it
          # here bakes the generating shell's empty parameters into the file
          # and the shim then drops every caller argument.
          printf 'exec node "%s/scripts/runPinnedCorepack.mjs" %s "$@"\n' \
            "$GITHUB_WORKSPACE" "'$package_manager'"
        } > "$bin_dir/pnpm"
        chmod +x "$bin_dir/pnpm"
        echo "MARKTEXT_PINNED_PNPM_BIN=$bin_dir" >> "$GITHUB_ENV"
        echo "$bin_dir" >> "$GITHUB_PATH"
        test "$("$bin_dir/pnpm" --version)" = "10.33.4"

    - name: Install Dependencies
      shell: bash
      run: |
        package_manager='pnpm@10.33.4+sha512.1c67b3b359b2d408119ba1ed289f34b8fc3c6873412bec6fd264fbdc82489e510fcbecb9ce9d22dae7f3b76269d8441046014bdca53b9979cd7a561ad631b800'
        node scripts/runPinnedCorepack.mjs "$package_manager" install --frozen-lockfile --ignore-scripts
      env:
        GITHUB_TOKEN: ${{ github.token }}
