name: CriticMarkup Review Platforms

# Legacy platform regression oracle originating in archived plan 0006 Wave 7.
# Plan 0009 defines the target platform acceptance for the rebuilt engine.
# These jobs pair a real per-OS desktop bundle with the Review menu/keybinding
# suites, plus the vendored Marked fork verification from a clean checkout.

on:
  workflow_dispatch:
  # workflow_dispatch resolves only against the default branch, so the
  # feature branch carries a push trigger to get platform signal before any
  # PR exists. Drop this block once the workflow lands on develop.
  push:
    branches:
      - feat/native-criticmarkup
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/desktop/**'
      - 'packages/marked/**'
      - 'packages/muya/src/**'
      - 'scripts/minify-locales.ts'
      - 'scripts/minifyLocaleJson.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/critic-review-platforms.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-platform:
    name: review-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Bundle the desktop app for this platform
        run: pnpm --filter marktext run build

      - name: Run Review menu, keybinding, and presentation suites
        run: >-
          pnpm --filter marktext exec vitest run
          test/unit/specs/critic-markup-autosave.spec.ts
          test/unit/specs/critic-markup-comment-composer.spec.ts
          test/unit/specs/critic-markup-comment-context-ipc.spec.ts
          test/unit/specs/critic-markup-comment-edit-ack.spec.ts
          test/unit/specs/critic-markup-context-menu.spec.ts
          test/unit/specs/critic-markup-print-security.spec.ts
          test/unit/specs/critic-markup-rejection-presentation.spec.ts
          test/unit/specs/critic-markup-review-architecture.spec.ts
          test/unit/specs/critic-markup-review-focus.spec.ts
          test/unit/specs/critic-markup-review-sidebar-locales.spec.ts
          test/unit/specs/critic-markup-review-sidebar-shell.spec.ts
          test/unit/specs/critic-markup-review-sidebar.spec.ts
          test/unit/specs/critic-markup-review-store.spec.ts
          test/unit/specs/critic-markup-review.spec.ts
          test/unit/specs/review-command-descriptors.spec.ts
          test/unit/specs/review-menu-ipc.spec.ts

  fork-verify-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22.21.1'

      # The verifier needs only git and node. Running it inside an empty
      # network namespace proves the clean-checkout contract holds with no
      # network access at all (Wave 6 gate).
      - name: Verify vendored Marked fork offline
        run: |
          sudo git config --global --add safe.directory '*'
          sudo unshare --net -- node packages/marked/scripts/verify-fork.mjs --self-test
