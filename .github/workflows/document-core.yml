name: Document Core

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/document-core/**'
      - 'packages/muya/e2e/host/document-core-tracer/**'
      - 'packages/muya/e2e/tests/document-core/**'
      - 'packages/muya/e2e/tests/helpers/temporaryFileSnapshot.ts'
      - 'packages/muya/e2e/package.json'
      - 'packages/muya/e2e/playwright.config.ts'
      - 'packages/muya/e2e/tsconfig.json'
      - 'packages/muya/e2e/tsconfig.document-core.json'
      - 'packages/muya/e2e/vite.config.ts'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'eslint.config.js'
      - 'pnpm-lock.yaml'
      - '.github/actions/setup/**'
      - '.github/workflows/document-core.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Check document core
        run: pnpm -C packages/document-core check

  browser-walking-tracer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Typecheck document-core browser tracer
        run: pnpm -C packages/muya/e2e run typecheck:document-core-tracer

      - name: Install Playwright Chromium
        run: pnpm -C packages/muya/e2e exec playwright install --with-deps chromium

      - name: Run document-core browser walking tracer
        run: >-
          pnpm -C packages/muya/e2e exec playwright test
          tests/document-core/walking-tracer.spec.ts
          --project=chromium
          --workers=1
