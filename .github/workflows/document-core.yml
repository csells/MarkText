name: Document Core

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/document-core/**'
      - 'packages/document-view/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'eslint.config.js'
      - 'pnpm-lock.yaml'
      - '.github/actions/setup/**'
      - '.github/workflows/document-core.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Check document core
        run: pnpm -C packages/document-core check

  browser-document-view:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Typecheck document view
        run: pnpm -C packages/document-view typecheck

      - name: Install Playwright Chromium
        run: pnpm -C packages/document-view exec playwright install --with-deps chromium

      - name: Run the target-owned browser view
        run: pnpm -C packages/document-view test:e2e -- --project=chromium --workers=1
